<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 扭蛋打卡 App 图标：皮粉×米白相间的可爱狗狗（favicon 用圆角，apple-touch 用直角由生成脚本替换） -->
  <rect width="512" height="512" rx="112" fill="#F6EAD8"/>
  <!-- 耳朵：左粉右米白（内耳粉），垂耳 -->
  <ellipse cx="112" cy="236" rx="58" ry="96" transform="rotate(18 112 236)" fill="#F2C7BB"/>
  <ellipse cx="400" cy="236" rx="58" ry="96" transform="rotate(-18 400 236)" fill="#FFFBF2"/>
  <ellipse cx="404" cy="242" rx="36" ry="64" transform="rotate(-18 404 242)" fill="#F6CDBD"/>
  <!-- 头（米白） -->
  <ellipse cx="256" cy="278" rx="168" ry="148" fill="#FFFBF2"/>
  <!-- 头顶粉色斑纹（与米白相间） -->
  <clipPath id="head"><ellipse cx="256" cy="278" rx="168" ry="148"/></clipPath>
  <g clip-path="url(#head)">
    <ellipse cx="128" cy="128" rx="132" ry="86" fill="#F6CDBD"/>
  </g>
  <!-- 右眼周粉斑 -->
  <ellipse cx="316" cy="262" rx="46" ry="40" fill="#F6CDBD"/>
  <!-- 眼睛 -->
  <circle cx="196" cy="268" r="15" fill="#46382F"/>
  <circle cx="316" cy="268" r="15" fill="#46382F"/>
  <circle cx="191" cy="263" r="5" fill="#FFFFFF"/>
  <circle cx="311" cy="263" r="5" fill="#FFFFFF"/>
  <!-- 鼻子与 ω 嘴 -->
  <ellipse cx="256" cy="306" rx="20" ry="14" fill="#5C4437"/>
  <path d="M256 320 C 250 336 236 340 226 332 M256 320 C 262 336 276 340 286 332" stroke="#5C4437" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- 小舌头 -->
  <path d="M243 336 q13 20 26 0 q-3 -9 -13 -9 q-10 0 -13 9z" fill="#F0968C"/>
  <!-- 腮红 -->
  <ellipse cx="148" cy="318" rx="24" ry="14" fill="#F8D8CA"/>
  <ellipse cx="364" cy="318" rx="24" ry="14" fill="#F8D8CA"/>
  <!-- 项圈 + 铃牌 -->
  <rect x="186" y="406" width="140" height="36" rx="18" fill="#E9A48F"/>
  <circle cx="256" cy="446" r="15" fill="#F6CDBD" stroke="#E9A48F" stroke-width="5"/>
</svg>
